name = "mobilus-telemetry-processor"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = true

[vars]
ENVIRONMENT = "development"
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
THINGBOARD_API_URL = ""
THINGBOARD_API_TOKEN = ""

[[queues.consumers]]
queue = "telemetry-events"
max_batch_size = 100
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "telemetry-dlq"

[[queues.producers]]
queue = "realtime-events"
binding = "REALTIME_QUEUE"

[[queues.producers]]
queue = "telemetry-dlq"
binding = "DLQ"

[env.production]
name = "mobilus-telemetry-processor-prod"

[env.production.vars]
ENVIRONMENT = "production"
