name = "mobilus-telemetry-ingestion"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = true

[vars]
ENVIRONMENT = "development"

[[queues.producers]]
queue = "telemetry-events"
binding = "TELEMETRY_QUEUE"

[[queues.consumers]]
queue = "telemetry-events"
max_batch_size = 100
max_batch_timeout = 30

[env.production]
name = "mobilus-telemetry-ingestion-prod"

[env.production.vars]
ENVIRONMENT = "production"
